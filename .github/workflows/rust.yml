name: Rust (Stage 1)

# Stage 1 gates from the Rust migration task guide, section 5.
# This workflow checks the Rust workspace only. It does not build,
# install, or replace the C++ daemon, and it does not run on a device.
#
# TODO(verify): pin actions to commit SHAs (analysis finding 11).
# This workflow follows the existing repository convention of major
# tags (for example, actions/checkout@v7 in build.yml) until SHA
# pinning is done as a separate, verified change. Do not claim
# SHA pinning is in place.

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "rust/**"
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/rust.yml"
      - "rust/**"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gates:
    name: Rust quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency policy check
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit
